<!doctype html>
<html lang="en" class="scrollbar-none">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Situations || Gaulingo</title>
    <link rel="stylesheet" href="../src/output.css" />
    <link rel="icon" type="image/x-icon" href="" />
    <script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Unbounded:wght@200..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="font-figtree relative scrollbar-none overflow-x-hidden">
    <header id="site-header" class="site-header">
      <span class="site-header__glass" aria-hidden="true"></span>
      <div class="site-header__side">
        <div class="site-lang" role="group" aria-label="Language">
          <button type="button" class="site-lang__item" aria-pressed="true">
            EN
          </button>
          <button type="button" class="site-lang__item" aria-pressed="false">
            ID
          </button>
        </div>
      </div>
      <a
        href="index.html"
        class="site-header__brand"
        aria-label="Gaulingo, home"
      >
        <img src="./src/assets/logo.svg" alt="Gaulingo Logo" />
      </a>
      <div class="site-header__side site-header__side--end">
        <button
          id="menu-toggle"
          type="button"
          class="site-menu-toggle roll-host"
          aria-controls="site-menu"
          aria-expanded="false"
          aria-label="Open menu"
        >
          <div class="site-menu-toggle__pill" aria-hidden="true">
            <p
              class="site-menu-toggle__label site-menu-toggle__label--menu"
              data-roll
            >
              Menu
            </p>
            <p
              class="site-menu-toggle__label site-menu-toggle__label--close"
              data-roll
            >
              Close
            </p>
          </div>
          <div class="site-menu-toggle__disc" aria-hidden="true">
            <div class="site-menu-toggle__diamond"></div>
            <i class="ph-bold ph-x site-menu-toggle__close-icon"></i>
          </div>
        </button>
      </div>
    </header>
    <div id="site-menu" class="site-menu">
      <nav class="site-menu__inner" aria-label="Main navigation">
        <ul class="site-menu__list" style="--last: 4">
          <li class="site-menu__item" style="--i: 0">
            <div class="site-menu__row">
              <a
                href="../index.html"
                class="site-menu__link roll-host"
                aria-current="page"
              >
                <div class="site-menu__rise">
                  <p class="site-menu__num">01</p>
                  <h3 data-roll>Home</h3>
                  <span class="site-menu__marker" aria-hidden="true"></span>
                </div>
              </a>
            </div>
          </li>
          <li class="site-menu__item is-active" style="--i: 1">
            <div class="site-menu__row">
              <a href="./situations.html" class="site-menu__link roll-host">
                <span class="site-menu__rise">
                  <span class="site-menu__num">02</span>
                  <span data-roll>Situations</span>
                  <span class="site-menu__marker" aria-hidden="true"></span>
                </span>
              </a>
            </div>
          </li>
          <li class="site-menu__item" style="--i: 2">
            <div class="site-menu__row">
              <a href="./culture.html" class="site-menu__link roll-host">
                <div class="site-menu__rise">
                  <p class="site-menu__num">03</p>
                  <h3 data-roll>Culture</h3>
                  <span class="site-menu__marker" aria-hidden="true"></span>
                </div>
              </a>
            </div>
          </li>
          <li class="site-menu__item" style="--i: 3">
            <div class="site-menu__row">
              <a href="./practice.html" class="site-menu__link roll-host">
                <div class="site-menu__rise">
                  <p class="site-menu__num">04</p>
                  <h3 data-roll>Practice</h3>
                  <span class="site-menu__marker" aria-hidden="true"></span>
                </div>
              </a>
            </div>
          </li>
          <li class="site-menu__item" style="--i: 4">
            <div class="site-menu__row">
              <a href="./about.html" class="site-menu__link roll-host">
                <div class="site-menu__rise">
                  <p class="site-menu__num">05</p>
                  <h3 data-roll>About</h3>
                  <span class="site-menu__marker" aria-hidden="true"></span>
                </div>
              </a>
            </div>
          </li>
        </ul>
        <ul class="site-menu__secondary">
          <li>
            <a href="#" class="roll-host"
              ><i class="ph-fill ph-chat-circle-dots"></i>
              <p data-roll>Chat with Gali</p></a
            >
          </li>
          <li>
            <a href="https://www.instagram.com/" class="roll-host"
              ><p data-roll>Instagram</p></a
            >
          </li>
          <li>
            <a href="https://www.tiktok.com/" class="roll-host"
              ><p data-roll>TikTok</p></a
            >
          </li>
          <li>
            <a href="https://www.youtube.com/" class="roll-host"
              ><p data-roll>YouTube</p></a
            >
          </li>
        </ul>
      </nav>
    </div>
    <main
      class="w-screen bg-[#fff8f8] flex flex-col items-center pt-5 max-md:pt-2 pb-0"
    >
      <!-- hero -->
      <section
        id="home"
        class="transform-[scale(calc(1-var(--hero-p,0)*0.2))] origin-bottom will-change-transform sticky top-5 max-md:top-2 w-[calc(100vw-80px)] h-[calc(75vh-40px)] max-md:w-[calc(100vw-40px)] max-md:h-[calc(75vh-20px)] overflow-hidden rounded-[clamp(24px,3.5vw,48px)] bg-pasir @container-size isolate shadow-[0_0_0_1px_rgba(45,83,158,0.06),0_28px_50px_rgba(45,83,158,0.08)]"
      >
        <div class="w-full relative px-6 py-14 sm:px-12 lg:px-16 lg:py-20">
          <div class="mb-5 flex items-center gap-5 text-xs">
            <a href="#" class="rounded-sm underline-offset-4 hover:underline"
              >Home</a
            >
            <i class="ph-bold ph-caret-right"></i>
            <a class="font-medium">Situations</a>
          </div>
          <h1
            class="font-unbounded text-nila max-sm:text-3xl leading-[1.02] font-black tracking-tight uppercase max-md:text-4xl text-6xl"
          >
            Where are you<br />today?
          </h1>
          <p class="mt-5 max-w-md text-sm leading-relaxed sm:text-base">
            Pick the place you are in. Gali brings the phrases, the
            pronunciation, and the manners that go with it.
          </p>
          <form
            role="search"
            action="#"
            class="mt-7 flex w-full max-w-lg items-center gap-3 rounded-full bg-white p-1.5 pl-5 shadow-sm max-sm:text-[10px]"
          >
            <svg
              aria-hidden="true"
              viewBox="0 0 20 20"
              class="size-4 shrink-0 fill-none stroke-nila stroke-[1.75]"
              stroke-linecap="round"
            >
              <circle cx="9" cy="9" r="6" />
              <path d="m13.5 13.5 4 4" />
            </svg>

            <label for="search" class="sr-only"
              >Search a phrase or a place</label
            >
            <input
              id="search"
              type="search"
              name="q"
              placeholder="Search a phrase or a place..."
              class="min-w-0 flex-1 bg-transparent text-sm text-nila outline-none placeholder:text-nila/50"
            />

            <button
              type="submit"
              class="shrink-0 cursor-pointer rounded-full bg-nila px-6 py-3 text-xs font-bold text-white transition-colors hover:bg-biru-aksen max-sm:px-2 max-sm:py-2 max-sm:text-[10px]"
            >
              Search
            </button>
          </form>
        </div>
        <div
          class="absolute -right-25 -bottom-25 -z-1 aspect-square w-1/4 rounded-full bg-matahari max-lg:w-1/2"
        ></div>
      </section>
      <div
        class="w-full relative px-6 py-14 sm:px-12 lg:px-16 lg:py-20 z-1 m-0 bg-krem rounded-t-4xl -top-20"
      >
        <!--  -->
        <section class="flex">
          <div>
            <button>all</button>
          </div>
        </section>
      </div>
    </main>
    <script src="../script.js"></script>
  </body>
</html>
